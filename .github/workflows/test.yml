name: Test & Verify

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip running automated tests'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Build, Test & Publish Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        if: |
          inputs.skip_tests != true &&
          !contains(github.event.head_commit.message, '[skip test]') &&
          !contains(github.event.head_commit.message, '[skip tests]') &&
          !contains(github.event.head_commit.message, '[skip-test]') &&
          !contains(github.event.head_commit.message, '[skip-tests]') &&
          !contains(github.event.pull_request.title, '[skip test]') &&
          !contains(github.event.pull_request.title, '[skip tests]') &&
          !contains(github.event.pull_request.title, '[skip-test]') &&
          !contains(github.event.pull_request.title, '[skip-tests]')
        run: npm test

      - name: Skip tests notice
        if: |
          inputs.skip_tests == true ||
          contains(github.event.head_commit.message, '[skip test]') ||
          contains(github.event.head_commit.message, '[skip tests]') ||
          contains(github.event.head_commit.message, '[skip-test]') ||
          contains(github.event.head_commit.message, '[skip-tests]') ||
          contains(github.event.pull_request.title, '[skip test]') ||
          contains(github.event.pull_request.title, '[skip tests]') ||
          contains(github.event.pull_request.title, '[skip-test]') ||
          contains(github.event.pull_request.title, '[skip-tests]')
        run: echo "ℹ️ Automated tests skipped via skip flag."

      - name: Build CLI and Cloudflare Worker bundles
        run: npm run build

      - name: Verify CLI executable
        run: |
          node dist/cli.js --version
          node dist/cli.js --help

      - name: Verify Cloudflare Worker bundle (global-scope sandbox & handler smoke tests)
        run: npm run verify:worker

      - name: Upload verified Cloudflare Worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode2api-cloudflare-worker
          path: worker/worker.js
          if-no-files-found: error

      - name: Publish verified worker/worker.js to branch
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/worker.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(worker): publish verified worker/worker.js bundle [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "✓ Published updated worker/worker.js to ${GITHUB_REF_NAME}."
          else
            echo "✓ worker/worker.js is already up to date on ${GITHUB_REF_NAME}."
          fi
