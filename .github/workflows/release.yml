name: Build release archives

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0, or leave empty to use package.json version)"
        required: false
        type: string
        default: ""
      draft:
        description: "Create the release as a draft"
        required: false
        type: boolean
        default: true
      overwrite:
        description: "Overwrite existing release if tag already exists"
        required: false
        type: boolean
        default: true
      release_notes:
        description: "Custom release notes (leave blank to auto-generate from commits)"
        required: false
        type: string
        default: ""
      skip_tests:
        description: "Skip running automated tests"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.metadata.outputs.should_run }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      is_draft: ${{ steps.metadata.outputs.is_draft }}
      overwrite: ${{ steps.metadata.outputs.overwrite }}
      skip_tests: ${{ steps.metadata.outputs.skip_tests }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_DRAFT: ${{ inputs.draft }}
          DISPATCH_OVERWRITE: ${{ inputs.overwrite }}
          DISPATCH_SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            if [[ "$COMMIT_MSG" != *"[release]"* && "$COMMIT_MSG" != *"[draft-release]"* && "$COMMIT_MSG" != *"[release-draft]"* ]]; then
              echo "Push commit does not contain [release] or [draft-release] flag. Skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            is_draft="true"
            overwrite="true"
            skip_tests="false"
          else
            is_draft="${DISPATCH_DRAFT:-true}"
            overwrite="${DISPATCH_OVERWRITE:-true}"
            skip_tests="${DISPATCH_SKIP_TESTS:-false}"
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"
          echo "overwrite=$overwrite" >> "$GITHUB_OUTPUT"
          echo "skip_tests=$skip_tests" >> "$GITHUB_OUTPUT"

          tag="${DISPATCH_TAG:-}"
          if [ -z "$tag" ]; then
            pkg_version=$(node -p "require('./package.json').version")
            tag="v$pkg_version"
          fi
          if [[ ! "$tag" =~ ^v ]]; then
            tag="v$tag"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must be a valid semantic version like v1.0.0 or v1.0.0-rc.1: $tag" >&2
            exit 1
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $tag (draft: $is_draft, overwrite: $overwrite)"

  verify:
    name: Verify source
    needs: [prepare]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        if: needs.prepare.outputs.skip_tests != 'true'
        run: npm test

      - name: Skip tests notice
        if: needs.prepare.outputs.skip_tests == 'true'
        run: echo "ℹ️ Automated tests skipped via flag."

      - name: Build the bundles
        run: npm run build

      - name: Verify Cloudflare Worker bundle
        run: npm run verify:worker

      - name: Upload verified worker.js asset
        uses: actions/upload-artifact@v4
        with:
          name: opencode2api-proxy-${{ needs.prepare.outputs.release_tag }}-worker
          path: worker/worker.js
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, verify]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
          - target: linux-arm64
            runner: ubuntu-latest
            platform: linux
            arch: arm64
          - target: win-x64
            runner: windows-latest
            platform: win32
            arch: x64
          - target: win-arm64
            runner: windows-latest
            platform: win32
            arch: arm64
          - target: macos-x64
            runner: macos-13
            platform: darwin
            arch: x64
          - target: macos-arm64
            runner: macos-latest
            platform: darwin
            arch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the CLI bundle
        run: npm run build

      - name: Package the archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "release/$TARGET"
          cp dist/cli.js "release/$TARGET/opencode2api-proxy.js"
          cp config.example.json "release/$TARGET/config.example.json"
          cp README.md "release/$TARGET/README.md"
          cp LICENSE "release/$TARGET/LICENSE"
          if [[ "$PLATFORM" == "win32" ]]; then
            cp package.json "release/$TARGET/package.json"
          fi
          cd "release/$TARGET"
          zip -r "../opencode2api-proxy-$RELEASE_TAG-$TARGET.zip" . -q
          cd ..
          rm -rf "$TARGET"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: opencode2api-proxy-${{ needs.prepare.outputs.release_tag }}-${{ matrix.target }}
          path: release/opencode2api-proxy-*.zip
          if-no-files-found: error

  release:
    name: Create the draft release
    needs: [prepare, verify, build]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          pattern: opencode2api-proxy-*

      - name: List the archives
        run: ls -la release

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          IS_DRAFT: ${{ needs.prepare.outputs.is_draft }}
          OVERWRITE: ${{ needs.prepare.outputs.overwrite }}
          CUSTOM_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          if [ "$OVERWRITE" = "true" ]; then
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG already exists and overwrite=true. Deleting previous release..."
              gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
            fi
          fi

          draft_flag=""
          if [ "$IS_DRAFT" = "true" ]; then
            draft_flag="--draft"
          fi

          notes_args="--generate-notes"
          if [ -n "$CUSTOM_NOTES" ]; then
            printf "%s\n" "$CUSTOM_NOTES" > release_notes.md
            notes_args="--notes-file release_notes.md"
          fi

          gh release create "$RELEASE_TAG" \
            release/*.zip \
            release/worker.js \
            --title "OpenCode2API-Proxy $RELEASE_TAG" \
            $notes_args \
            $draft_flag
